### model
model_name_or_path: /path/to/models/qwen3-32b
trust_remote_code: true

### method
stage: dpo
pref_beta: 0.2
pref_loss: sigmoid
do_train: true

### dataset
dataset: roadmapper_dpo
template: qwen3
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: /path/to/saves/dpo/qwen3-32b
logging_steps: 1
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5e-5
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100

flash_attn: fa2
